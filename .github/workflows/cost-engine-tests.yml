name: Cost intelligence engine tests

on:
  pull_request:
    paths:
      - "src/lib/costing/**"
      - "docs/cost-intelligence/formula-registry.v1.1.json"
      - ".github/workflows/cost-engine-tests.yml"
  push:
    branches:
      - "feat/dynamic-cost-intelligence-v1-1"
    paths:
      - "src/lib/costing/**"
      - "docs/cost-intelligence/formula-registry.v1.1.json"
      - ".github/workflows/cost-engine-tests.yml"

permissions:
  contents: read

jobs:
  cost-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic costing regression tests
        run: node --test src/lib/costing/engine-v1.1.test.mjs
